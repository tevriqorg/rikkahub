name: P14 Recovery Signed Test APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare stable P14 signing inputs
        run: |
          test -n "${{ secrets.KEY_BASE64 }}"
          test -n "${{ secrets.SIGNING_CONFIG }}"
          test -n "${{ secrets.GOOGLE_SERVICES_JSON }}"
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Test P14 recovery boundary
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --tests "me.rerere.rikkahub.data.remote.p14.*" --stacktrace

      - name: Build signed test APKs
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload signed test APKs
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-p14-recovery-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 3
