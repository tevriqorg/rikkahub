name: P14 Signed Release Build

on:
  push:
    branches:
      - fix/p14r3-g4-g7-correct-client

permissions:
  contents: read

jobs:
  build-signed-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: jetbrains
          java-version: '21'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml
      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Prepare signed release inputs
        run: |
          test -n "${{ secrets.KEY_BASE64 }}"
          test -n "${{ secrets.SIGNING_CONFIG }}"
          test -n "${{ secrets.GOOGLE_SERVICES_JSON }}"
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Build signed release APKs
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload signed release APKs
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-p14-signed-release-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
