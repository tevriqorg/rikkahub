name: P14 Recovery Governance

on:
  pull_request:
    branches:
      - p14/remote
  push:
    branches:
      - p14/remote
      - fix/p14r3-recovery
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pinned P14 recovery authority and commit Row mapping
        env:
          P14_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 scripts/check_p14_recovery.py --head "$P14_HEAD_SHA"

      - name: Validate PR requirement-row mapping
        if: github.event_name == 'pull_request'
        env:
          P14_PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_p14_recovery.py --head "${{ github.event.pull_request.head.sha }}" --pr-body-env P14_PR_BODY
